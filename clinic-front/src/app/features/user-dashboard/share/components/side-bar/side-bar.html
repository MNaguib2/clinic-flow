<aside
  id="clinicflow-sidebar"
  class="dashboard-sidebar"
  [class.is-open]="sidebar_state.is_open()"
  [class.is-closed]="!sidebar_state.is_open()"
>
  <a
    class="dashboard-brand"
    routerLink="/"
    [attr.aria-label]="organization_name"
    [attr.title]="organization_name"
    (click)="close()"
  >
    <span class="dashboard-brand-name">{{ organization_name }}</span>
    <span class="brand-heart" aria-hidden="true"></span>
  </a>

  <nav class="sidebar-nav" [attr.aria-label]="'sidebar.navigation' | translate">
    @for (item of nav_items; track item.id) {
      @if (item.route) {
        <a
          class="sidebar-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          (click)="close()"
        >
          <app-icon [name]="item.icon" class="sidebar-icon" />
          <span>{{ item.label_key | translate }}</span>
        </a>
      } @else {
        <button type="button" class="sidebar-link" (click)="close()">
          <app-icon [name]="item.icon" class="sidebar-icon" />
          <span>{{ item.label_key | translate }}</span>
        </button>
      }
    }
  </nav>

  <section class="support-card" [attr.aria-label]="'sidebar.support_heading' | translate">
    <div class="support-copy">
      <h2>{{ 'sidebar.support_heading' | translate }}</h2>
      <p>{{ 'sidebar.support_description' | translate }}</p>
    </div>
    <span class="support-action" aria-hidden="true">
      <app-icon name="arrow-right" />
    </span>
  </section>
</aside>

<button
  type="button"
  class="sidebar-backdrop"
  [class.is-visible]="sidebar_state.is_open()"
  [attr.aria-label]="'topbar.close_sidebar' | translate"
  [attr.aria-hidden]="!sidebar_state.is_open()"
  [disabled]="!sidebar_state.is_open()"
  (click)="close()"
></button>
