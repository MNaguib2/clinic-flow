
<header class="dashboard-header">
  <!-- User profile -->
  <div class="header-profile">
    <button
      type="button"
      class="profile-dropdown-btn"
      [attr.aria-label]="'topbar.toggle_profile_menu' | translate"
      [attr.aria-expanded]="profile_menu_open"
      (click)="toggle_profile_menu()"
    >
      <app-icon name="chevron-down" />
    </button>

    <button
      type="button"
      class="profile-info"
      [attr.aria-label]="'topbar.user_profile' | translate"
      [attr.aria-expanded]="profile_menu_open"
      (click)="toggle_profile_menu()"
    >
      <span class="user-avatar">
        {{ user_initials }}
      </span>

      <span class="user-details">
        <span class="user-name">
          {{ user_name }}
        </span>

        @if (user_role) {
          <span class="user-role">
            {{ user_role }}
          </span>
        }
      </span>
    </button>

    @if (profile_menu_open) {
      <div class="profile-dropdown">
        <div class="dropdown-user-info">
          <span class="dropdown-user-name">
            {{ user_name }}
          </span>

          @if (user_role) {
            <span class="dropdown-user-role">
              {{ user_role }}
            </span>
          }
        </div>

        <div class="dropdown-divider"></div>

        <button
          type="button"
          class="dropdown-item"
          (click)="logout()"
        >
          <app-icon name="arrow-right" />
          <span>{{ 'dashboard.logout' | translate }}</span>
        </button>
      </div>
    }
  </div>

  <!-- Brand -->
  <a
    class="dashboard-brand"
    routerLink="/"
    aria-label="ClinicFlow"
  >
    <span class="brand-name">
      Clinic<span>Flow</span>
    </span>

    <span class="brand-heart" aria-hidden="true"></span>
  </a>

  <!-- Actions -->
  <div class="header-actions">
    <button
      type="button"
      class="notification-btn"
      [attr.aria-label]="'topbar.notifications' | translate"
    >
      <app-icon name="notification" style="width: 20px; height: 20px; color: var(--bs-body-color)" />
    </button>

    <span class="header-separator"></span>

    <button
      type="button"
      class="language-btn"
      (click)="toggle_language()"
    >
      {{ language() === 'ar' ? 'English' : 'العربية' }}
    </button>

    <app-theme-toggle />
  </div>

  <!-- Search -->
  @if (!auth_store.startup()) {
    <div class="header-search">
      <input
        type="search"
        [placeholder]="'topbar.search_placeholder' | translate"
        [attr.aria-label]="'topbar.search_label' | translate"
      />

      <span class="search-icon">
        <app-icon name="search" />
      </span>
    </div>
  }
</header>
