<header class="dashboard-header">
  @if (!auth_store.startup()) {
  <button
    type="button"
    class="sidebar-toggle"
    [attr.aria-label]="'topbar.toggle_sidebar' | translate"
    [attr.aria-expanded]="sidebar_state.is_open()"
    aria-controls="clinicflow-sidebar"
    (click)="sidebar_state.toggle()"
  >
    <app-icon name="menu" />
  </button>
  }
  <!-- Search -->
  @if (!auth_store.startup()) {
  <div class="header-search">
    <app-field-input type="text" placeholder="topbar.search_placeholder" inputClass="header-search-input"
      ariaLabel="topbar.search_label" icon="search" />
  </div>
  }
  <!-- Brand -->
  <a class="dashboard-brand d-md-none" routerLink="/" aria-label="ClinicFlow">
    <span class="brand-name">
      Clinic<span>Flow</span>
    </span>

    <span class="brand-heart" aria-hidden="true"></span>
  </a>

  <!-- Actions -->
   <div class="d-flex gap-4">
  <div class="header-actions">

    <app-language-toggle />

    <app-theme-toggle />
    <span class="header-separator"></span>
    <button type="button" class="notification-btn" [attr.aria-label]="'topbar.notifications' | translate">
      <app-icon name="notification" style="width: 20px; height: 20px; color: var(--bs-body-color)" />
    </button>
  </div>

  <!-- User profile -->

<app-overlay-panel
  class="header-profile"
  placement="bottom-end"
  autoClose="outside"
  [(open)]="profile_menu_open"
>
  <div overlayPanelTrigger class="d-flex gap-3">
    <button
      type="button"
      class="profile-info"
      [attr.aria-label]="'topbar.user_profile' | translate"
      [attr.aria-expanded]="profile_menu_open"
    >
      <span class="user-avatar">{{ user_initials }}</span>

      <span class="user-details">
        <span class="user-name">{{ user_name }}</span>

        @if (user_role) {
          <span class="user-role">{{ user_role }}</span>
        }
      </span>
    </button>

    <button
      type="button"
      class="profile-dropdown-btn"
      tabindex="-1"
      aria-hidden="true"
    >
      <app-icon name="chevron-down" />
    </button>
  </div>

  <div class="profile-dropdown">
    <div class="dropdown-user-info">
      <span class="dropdown-user-name">{{ user_name }}</span>

      @if (user_role) {
        <span class="dropdown-user-role">{{ user_role }}</span>
      }
    </div>

    <div class="dropdown-divider"></div>

    <button type="button" class="dropdown-item" (click)="logout()">
      <app-icon name="arrow-right" />
      <span>{{ 'dashboard.logout' | translate }}</span>
    </button>

    <div class="d-flex flex-column d-md-none">
      <app-language-toggle />
      <app-theme-toggle />
    </div>
  </div>
</app-overlay-panel>
</div>
</header>
