
<header class="dashboard-header">

  @if (!auth_store.startup()) {
    <button
      type="button"
      class="sidebar-toggle"
      [attr.aria-label]="'topbar.toggle_sidebar' | translate"
      [attr.aria-expanded]="sidebar_state.is_open()"
      aria-controls="clinicflow-sidebar"
      (click)="sidebar_state.toggle()"
    >
      <app-icon name="menu" />
    </button>
  }

  @if (!auth_store.startup()) {
    <div class="header-search">
      <app-field-input
        type="text"
        placeholder="topbar.search_placeholder"
        inputClass="header-search-input"
        ariaLabel="topbar.search_label"
        icon="search"
      />
    </div>
  }

  <a
    class="dashboard-brand"
    routerLink="/"
    aria-label="ClinicFlow"
  >
    <span class="brand-name">
      Clinic<span>Flow</span>
    </span>
    <span class="brand-heart" aria-hidden="true"></span>
  </a>

  <div class="header-right">

    <div class="header-actions">
      <app-language-toggle />
      <app-theme-toggle />

      <span class="header-separator"></span>

      <button
        type="button"
        class="notification-btn"
        [attr.aria-label]="'topbar.notifications' | translate"
      >
        <app-icon name="notification" />
      </button>
    </div>

    <app-overlay-panel
      class="header-profile"
      placement="bottom-end"
      autoClose="outside"
      [(open)]="profile_menu_open"
    >
      <div overlayPanelTrigger class="profile-trigger">

        <button
          type="button"
          class="profile-info"
          [attr.aria-label]="'topbar.user_profile' | translate"
          [attr.aria-expanded]="profile_menu_open"
        >
          <span class="user-avatar">{{ user_initials }}</span>

          <span class="user-details">
            <span class="user-name">{{ user_name }}</span>

            @if (user_role) {
              <span class="user-role">{{ user_role }}</span>
            }
          </span>
        </button>

        <span class="profile-dropdown-btn" aria-hidden="true">
  <app-icon name="chevron-down" />
</span>

      </div>

      <div class="profile-dropdown">

        <div class="dropdown-user-info">
          <span class="dropdown-user-name">{{ user_name }}</span>

          @if (user_role) {
            <span class="dropdown-user-role">{{ user_role }}</span>
          }
        </div>

        <div class="dropdown-divider"></div>

        <button
          type="button"
          class="dropdown-item"
          (click)="logout()"
        >
          <app-icon name="arrow-right" />
          <span>{{ 'dashboard.logout' | translate }}</span>
        </button>

        <div class="profile-mobile-actions">
          <app-language-toggle />
          <app-theme-toggle />
        </div>

      </div>
    </app-overlay-panel>

  </div>
</header>
